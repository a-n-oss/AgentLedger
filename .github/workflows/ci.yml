name: CI

on:
  push:
    branches: [main, master, "cursor/**"]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: agentledger
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/agentledger
      AGENTLEDGER_DEMO_MODE: "true"
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      SEED_CLERK_ORG_ID: org_demo_agentledger

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace packages
        run: pnpm --filter @agentledger/shared build && pnpm --filter @agentledger/db build && pnpm --filter @agentledger/sdk build

      - name: Typecheck packages
        run: pnpm --filter @agentledger/shared typecheck && pnpm --filter @agentledger/db typecheck && pnpm --filter @agentledger/sdk typecheck && pnpm --filter @agentledger/web typecheck

      - name: Unit tests
        run: pnpm --filter @agentledger/shared test && pnpm --filter @agentledger/sdk test && pnpm --filter @agentledger/web test

      - name: Build web
        run: pnpm --filter @agentledger/web build

      - name: Migrate database
        run: pnpm db:migrate

      - name: Seed database
        run: pnpm db:seed

      - name: Lint web
        run: pnpm --filter @agentledger/web lint
